name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Validate tag against application version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tag_version="${RELEASE_TAG#v}"

          mapfile -t app_versions < <(
            sed -nE \
              's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              app/build.gradle.kts
          )

          if (( ${#app_versions[@]} != 1 )); then
            echo "::error title=Invalid application version::Expected exactly one versionName in app/build.gradle.kts, but found ${#app_versions[@]}."
            exit 1
          fi

          app_version="${app_versions[0]}"

          {
            echo "### Release version validation"
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Expected version: \`${tag_version}\`"
            echo "- Application version: \`${app_version}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${tag_version}" != "${app_version}" ]]; then
            echo "::error title=Release version mismatch::Tag ${RELEASE_TAG} requires versionName ${tag_version}, but app/build.gradle.kts declares ${app_version}."
            exit 1
          fi

          echo "Version validation passed: ${RELEASE_TAG} matches versionName ${app_version}."

      - name: Validate and build Debug APK
        run: >-
          ./gradlew clean testDebugUnitTest lintDebug assembleDebug
          --no-configuration-cache

      - name: Prepare release files
        id: package
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME}"
          apk_name="aetheris-${release_tag}-debug.apk"
          checksum_name="${apk_name}.sha256"

          mkdir -p release

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "release/${apk_name}"

          (
            cd release
            sha256sum "${apk_name}" > "${checksum_name}"
          )

          echo "apk_path=release/${apk_name}" \
            >> "${GITHUB_OUTPUT}"

          echo "checksum_path=release/${checksum_name}" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-${{ github.ref_name }}
          path: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          APK_PATH: ${{ steps.package.outputs.apk_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        run: |
          set -euo pipefail

          release_flags=()

          if [[ "${RELEASE_TAG}" == *"-alpha"* || \
                "${RELEASE_TAG}" == *"-beta"* || \
                "${RELEASE_TAG}" == *"-rc"* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "${RELEASE_TAG}" \
            "${APK_PATH}" \
            "${CHECKSUM_PATH}" \
            --verify-tag \
            --title "Aetheris ${RELEASE_TAG}" \
            --generate-notes \
            "${release_flags[@]}"
